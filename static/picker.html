<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Tab Group Sessions</title>
  <link rel="stylesheet" href="picker.css" />
</head>
<body>
  <div class="search">
    <input id="query" type="text" autocomplete="off" spellcheck="false" autofocus
           placeholder="Search groups and tabs — e.g. “api login”" aria-controls="results" />
  </div>
  <ul id="results" role="listbox"></ul>
  <div id="empty" hidden>No matches</div>
  <footer><kbd>↑</kbd><kbd>↓</kbd> select · <kbd>Enter</kbd> open · <kbd>Esc</kbd> close</footer>
  <script type="module" src="picker.js"></script>
</body>
</html>
