<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TGS Diagnostics</title>
  <link rel="stylesheet" href="diagnostics.css" />
</head>
<body>
  <h1>Tab Group Sessions — diagnostics</h1>
  <div id="actions">
    <button id="probes" autofocus><kbd>p</kbd> Run probes</button>
    <button id="dump"><kbd>d</kbd> Dump state</button>
    <button id="copy"><kbd>c</kbd> Copy log as JSON</button>
    <button id="refresh"><kbd>r</kbd> Refresh</button>
    <button id="clear"><kbd>x</kbd> Clear log</button>
    <button id="snapNow"><kbd>n</kbd> Snapshot now</button>
    <button id="snapView"><kbd>v</kbd> View latest snapshot</button>
  </div>
  <div id="status"></div>
  <pre id="output"></pre>
  <h2>Snapshots (newest first)</h2>
  <pre id="snapshots"></pre>
  <h2>Shortcuts</h2>
  <pre id="commands"></pre>
  <h2>Event log (newest last)</h2>
  <pre id="log"></pre>
  <script type="module" src="diagnostics.js"></script>
</body>
</html>
